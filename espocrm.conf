<VirtualHost *:80>
    # EspoCRM'in gerektirdiği gibi, web sunucusunun kök dizinini 'public' klasörü olarak ayarla.
    DocumentRoot /app/public

    # 'client' dizini için bir takma ad (alias) oluştur.
    Alias /client /app/client

    # 'public' dizini için .htaccess dosyalarının yapılandırmayı geçersiz kılmasına izin ver.
    # Bu, yönlendirme kurallarının ve SEO dostu URL'lerin çalışması için kritik öneme sahiptir.
    <Directory /app/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Standart log dosyaları.
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost> 