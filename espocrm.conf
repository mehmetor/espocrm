# EspoCRM Resmi Dokümantasyonuna Dayalı Nginx Yapılandırması
# Kaynak: https://docs.espocrm.com/administration/nginx-server-configuration/
# Bu yapılandırma, Railway ortamı için uyarlanmıştır.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    # Hata ayıklama için tüm logları standart çıktıya yönlendir.
    # Bu, Railway Deploy Log'larında hataları görmemizi sağlar.
    access_log /dev/stdout;
    error_log /dev/stderr info;

    # Genel ayarlar
    charset utf-8;
    client_max_body_size 50M;

    # Ana kök dizin
    root /app/public;
    index index.php;

    # Railway Sağlık Kontrolü için özel, basit bir uç nokta.
    # Bu, uygulamanın kendisindeki olası hataları bypass eder.
    location = /health {
        try_files $uri /healthcheck.php =404;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # /client istekleri için özel konum bloğu
    # Dokümandasyondaki gibi, /client/css/style.css -> /app/client/css/style.css eşlemesi yapılır.
    # 'alias' direktifi bu tür eşlemeler için daha güvenilirdir.
    location /client/ {
        alias /app/client/;
        autoindex off;

        # Dokümandaki gibi, statik dosyalar için önbellekleme ve logları kapatma.
        location ~* \.(js|css|png|jpg|svg|svgz|jpeg|gif|ico|tpl)$ {
            access_log off;
            expires 1M; # Tarayıcıda 1 ay önbelleğe al
        }
    }

    # API, Portal ve diğer tüm istekleri ana index.php'ye yönlendir.
    # Bu, EspoCRM'in kendi yönlendiricisinin URL'leri işlemesini sağlar.
    location / {
        # Kurulumu tamamlamak için tüm istekleri geçici olarak /install'a yönlendir.
        return 302 /install;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP dosyalarını işlemesi için PHP-FPM'e gönder
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php-fpm.sock; # Railway standart soketi
        fastcgi_index index.php;
        include fastcgi_params;

        # Proxy Başlıkları: PHP'nin doğru URL'leri oluşturmasını sağla.
        # Bu, hatalı :8080 port yönlendirmesini ve zaman aşımı hatasını çözer.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTPS on;
    }

    # Güvenlik: Dokümandaki gibi, hassas dosyalara erişimi engelle
    location ~ /(\.htaccess|\web.config|\.git) {
        deny all;
    }
} 