server {
    # Railway tarafından sağlanan portu dinle
    listen 8080 default_server;
    listen [::]:8080 default_server;

    # EspoCRM'in istediği gibi, web kök dizinini /app/public olarak ayarla
    root /app/public;
    index index.php;

    # Gelen istekleri /index.php'ye yönlendirerek temiz URL'lerin çalışmasını sağla
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # /api/v1/websocket isteklerini PHP-FPM'e yönlendir
    location /api/v1/websocket {
        try_files $uri /index.php?$query_string;
    }

    # /client dizini için bir takma ad (alias) oluştur
    location /client {
        alias /app/client;
        location ~* \.js$ {
            # Gerekli olabilecek ek JavaScript ayarları
        }
    }

    # PHP dosyalarını işlemesi için PHP-FPM'e gönder
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # Railway'in PHP-FPM soket yolu genellikle bu şekildedir
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Güvenlik için .ht ile başlayan dosyalara erişimi engelle
    location ~ /\.ht {
        deny all;
    }
} 