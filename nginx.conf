
events {}

http {
    include /etc/nginx/mime.types;
    # Increase max body size to allow for large file uploads
    client_max_body_size 25M;

    server {
        listen 8080; # Railway uses the PORT environment variable, which is typically 8080
        server_name _;
        root /app/public;

        index index.php;

        # Redirect all requests to index.php if file is not found
        location / {
            try_files $uri /index.php$is_args$args;
        }

        # Pass PHP scripts to PHP-FPM
        location ~ \.php$ {
            fastcgi_pass unix:/run/php-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 300;
        }

        # Security: Deny access to sensitive files and directories
        location ~ /\. {
            deny all;
        }
        location ~* /(composer\.json|composer\.lock|package\.json|package-lock\.json|Gruntfile\.js|README\.md)$ {
            deny all;
        }
        location ~* ^/(bin|custom|data|dev|application|install|schema|tests|upgrades)/ {
            deny all;
        }
    }
}
