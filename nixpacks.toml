[phases.setup]
# Gerekli paketleri kur.
nixPkgs = ["...", "bzip2"]

# Nginx yapılandırmasını kopyala ve başlangıç scriptini çalıştırılabilir yap.
cmds = [
  "mkdir -p /etc/nginx/conf.d",
  "cp espocrm.conf /etc/nginx/conf.d/default.conf",
  "chmod +x start.sh"
]

# Uygulamayı başlatmak için varsayılan komut yerine kendi scriptimizi kullan.
[start]
cmd = "./start.sh"
