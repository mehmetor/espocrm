[phases.setup]
# Railway'in varsayılan paketlerine sadece bzip2 ekle.
# Bu, en başta karşılaştığımız phantomjs hatasını çözer.
nixPkgs = ["...", "bzip2"]

# Zamanlama sorununu çözmek için önce hedef dizini oluştur,
# sonra varsayılan Nginx yapılandırmasını kendi özel yapılandırmamızla değiştir.
cmds = [
  "mkdir -p /etc/nginx/conf.d",
  "cp default.conf /etc/nginx/conf.d/default.conf"
]
